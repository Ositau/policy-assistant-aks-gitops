# Anything that arrives on plain HTTP is sent to HTTPS. (cert-manager's challenge routes are more
# specific, so they still win while a certificate is being issued.)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-to-https
  namespace: gateway
spec:
  parentRefs:
    - name: public
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
