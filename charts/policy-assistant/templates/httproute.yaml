# Gateway API route: this environment's host name -> the service. The shared Gateway (platform/gateway)
# terminates HTTPS with a Let's Encrypt certificate for each environment's host.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "pa.name" . }}
  labels: {{- include "pa.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ required "gateway.listener is required" .Values.gateway.listener }}
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    - backendRefs:
        - name: {{ include "pa.name" . }}
          port: 80
