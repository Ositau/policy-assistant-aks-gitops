{{- if and .Values.podDisruptionBudget.enabled .Values.image.tag }}
# Keep at least one pod running while nodes are upgraded or drained.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "pa.name" . }}
  labels: {{- include "pa.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "pa.selector" . | nindent 6 }}
{{- end }}
