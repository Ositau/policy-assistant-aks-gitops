# Pods run as this service account. Its federated credential (Terraform layer 1) lets it sign in to
# Azure as this environment's managed identity, and to Entra ID as the sign-in app, with no secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pa.name" . }}
  labels: {{- include "pa.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ required "workloadIdentity.clientId is required" .Values.workloadIdentity.clientId | quote }}
